<!doctype html>
<html lang="en" class="antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ChatAI - Premium Assistant</title>
    <meta name="description" content="A professional, modern AI chatbot." />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <!-- Fonts: Inter / Plus Jakarta Sans style -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-white text-zinc-900 dark:bg-zinc-950 dark:text-zinc-50 font-sans min-h-screen selection:bg-indigo-500/30">
    <div id="root" class="min-h-screen flex flex-col"></div>
    <script>
      // Initial theme setup to avoid FOUC
      const saved = localStorage.getItem('theme');
      if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
